name: DayframeScheduler
options:
  bundleIdPrefix: com.dayframe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.6"
settings:
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_COMPILATION_MODE: singlefile
      DEBUG_INFORMATION_FORMAT: dwarf
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Primary
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 77XMQVA342
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  DayframeScheduler:
    type: application
    platform: iOS
    sources:
      - DayframeScheduler
    dependencies:
      - package: Supabase
    info:
      path: DayframeScheduler/Info.plist
      properties:
        CFBundleDisplayName: Dayframe
        CFBundleURLTypes:
          - CFBundleURLName: com.dayframe.scheduler
            CFBundleURLSchemes:
              - dayframe
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Dayframe connects to the development Supabase server.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dayframe.scheduler
        SUPPORTS_MACCATALYST: NO
  DayframeSchedulerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/DayframeSchedulerTests
    dependencies:
      - target: DayframeScheduler
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dayframe.scheduler.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DayframeScheduler:
    build:
      targets:
        DayframeScheduler: all
        DayframeSchedulerTests: [test]
    run:
      enableGPUValidationMode: disabled
      environmentVariables:
        OS_ACTIVITY_MODE: disable
    test:
      targets:
        - DayframeSchedulerTests
